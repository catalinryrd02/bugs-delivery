<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOS BUGS DELIVERY | Iniciar Sesión</title>
    <meta name="theme-color" content="#921733">
    <meta name="description" content="LOS BUGS DELIVERY - tu comida favorita, también sin internet">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/icons/favicon-48.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="LOS BUGS">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="/icons/logo.png" alt="Logo LOS BUGS" width="120" height="120">
                <h1>LOS BUGS DELIVERY</h1>
                <p style="color:#7A4A56; margin-top:4px;">Tu comida favorita en minutos</p>
            </div>

            <div class="auth-tabs">
                <div class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Iniciar Sesión</div>
                <div class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">Crear Cuenta</div>
            </div>

            <!-- FORMULARIO LOGIN -->
            <form id="loginForm">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="loginEmail" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Entrar a LOS BUGS</button>
            </form>

            <!-- FORMULARIO REGISTRO CLIENTE -->
            <form id="registerForm" style="display:none;">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="regNombre" placeholder="Ej. Juan Pérez" required>
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="tel" id="regTelefono" placeholder="55 1234 5678" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="regEmail" placeholder="juan@correo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="regPassword" placeholder="Crea una contraseña" required>
                </div>
                <button type="submit" class="btn btn-dark" style="width:100%;">Registrarme como Cliente</button>
            </form>

            <!-- INSTALAR COMO APP (PWA) -->
            <div class="install-box" id="installBox" hidden>
                <p id="installTip">Instálala en tu teléfono y úsala incluso sin internet.</p>
                <button type="button" class="btn btn-primary" id="installBtn" hidden>📲 Instalar app</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
