<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOS BUGS | Panel Administrador</title>
    <meta name="theme-color" content="#921733">
    <meta name="description" content="LOS BUGS DELIVERY - tu comida favorita, también sin internet">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/icons/favicon-48.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="LOS BUGS">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="styles.css">
</head>
<body onload="initAdmin()">
    <nav class="navbar">
        <a class="brand" href="#" aria-label="LOS BUGS DELIVERY">
            <img src="/icons/logo.png" alt="Logo LOS BUGS" width="44" height="44">
            <span class="brand-name">LOS BUGS<small>ADMIN</small></span>
        </a>
        <div class="nav-right">
            <span class="user-welcome" id="welcomeUser">Bienvenido, Admin</span>
            <button class="btn btn-danger" onclick="logout()">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container">
        <!-- GESTIÓN DE PRODUCTOS -->
        <div class="panel-section" id="secProductos">
            <h2>🍔 Gestión de Productos del Menú</h2>
            <form id="addProductForm" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:12px; margin-top:15px;">
                <select id="prodRestaurante" required>
                    <option value="1">Burger Kingz Grill (Zona Centro)</option>
                    <option value="2">Tacos El Patrón (Zona Norte)</option>
                    <option value="3">Napoli Express Pizza (Zona Centro)</option>
                </select>
                <input type="text" id="prodNombre" placeholder="Nombre del platillo" required>
                <input type="text" id="prodDesc" placeholder="Descripción breve" required>
                <input type="number" step="0.01" id="prodPrecio" placeholder="Precio ($ MXN)" required>
                <input type="url" id="prodImg" placeholder="URL de imagen (https://...)" required>
                <button type="submit" class="btn btn-primary">+ Agregar Producto</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Platillo</th>
                        <th>Restaurante / Zona</th>
                        <th>Precio</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="adminProductosTable"></tbody>
            </table>
        </div>

        <!-- GESTIÓN DE REPARTIDORES -->
        <div class="panel-section" id="secRepartidores">
            <h2>🛵 Registrar Nuevo Repartidor</h2>
            <form id="addRepartidorForm" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:12px; margin-top:15px;">
                <input type="text" id="repNombre" placeholder="Nombre completo" required>
                <input type="email" id="repEmail" placeholder="Correo electrónico" required>
                <input type="password" id="repPass" placeholder="Contraseña" required>
                <input type="text" id="repTel" placeholder="Teléfono" required>
                <input type="text" id="repVehiculo" placeholder="Vehículo (Ej. Moto 150cc)" required>
                <button type="submit" class="btn btn-dark">+ Alta Repartidor</button>
            </form>
        </div>

        <!-- LISTA DE TODOS LOS USUARIOS Y REPARTIDORES -->
        <div class="panel-section" id="secUsuarios">
            <h2>👥 Usuarios y Repartidores Registrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Teléfono / Vehículo</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="adminUsuariosTable"></tbody>
            </table>
        </div>
    </div>


    <!-- BARRA DE NAVEGACIÓN INFERIOR -->
    <nav class="bottom-nav" id="bottomNav" aria-label="Navegación principal">
        <button type="button" class="bn-item active" data-target="secProductos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v8a2 2 0 0 0 2 2v8M10 3v8a2 2 0 0 1-2 2M18 21V3c-2.5 1-4 4-4 8 0 2 1 3 4 3"/></svg><span class="bn-label">Productos</span></button>
        <button type="button" class="bn-item" data-target="secRepartidores"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h6l-3-8H9M14 6h3l1 5"/></svg><span class="bn-label">Repartidores</span></button>
        <button type="button" class="bn-item" data-target="secUsuarios"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg><span class="bn-label">Usuarios</span></button>
        <button type="button" class="bn-item" data-keep="true" onclick="logout()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg><span class="bn-label">Salir</span></button>
    </nav>

    <script src="app.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
