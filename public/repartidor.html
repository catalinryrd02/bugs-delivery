<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOS BUGS | App Repartidor</title>
    <meta name="theme-color" content="#7B2857">
    <meta name="description" content="LOS BUGS DELIVERY - tu comida favorita, también sin internet">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/icons/favicon-48.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="LOS BUGS">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="styles.css">
    <!-- Estilos de Leaflet (Mapa gratuito) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body onload="initRepartidor()">
    <nav class="navbar">
        <a class="brand" href="#" aria-label="LOS BUGS DELIVERY">
            <img src="/icons/logo.png" alt="Logo LOS BUGS" width="44" height="44">
            <span class="brand-name">LOS BUGS<small>REPARTIDOR</small></span>
        </a>
        <div class="nav-right">
            <span class="user-welcome" id="welcomeUser">Bienvenido, Repartidor</span>
            <button class="btn btn-danger" onclick="logout()">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container">
        <div class="panel-section" id="secMapa">
            <h2>🗺️ Mapa de Ruta de Entrega</h2>
            <p style="color:var(--text-muted); margin-bottom:10px;">Selecciona un pedido abajo para visualizar la ubicación exacta de entrega en el mapa.</p>
            <div id="driverMap" class="map-box"></div>
        </div>

        <div class="panel-section" id="secPedidos">
            <h2>📦 Pedidos Disponibles y Entregas Activas</h2>
            <table>
                <thead>
                    <tr>
                        <th># Pedido</th>
                        <th>Cliente y Teléfono</th>
                        <th>Dirección de Entrega</th>
                        <th>Total / Pago</th>
                        <th>Estado</th>
                        <th>Acciones de Entrega</th>
                    </tr>
                </thead>
                <tbody id="driverPedidosTable"></tbody>
            </table>
        </div>
    </div>


    <!-- BARRA DE NAVEGACIÓN INFERIOR -->
    <nav class="bottom-nav" id="bottomNav" aria-label="Navegación principal">
        <button type="button" class="bn-item active" data-target="secMapa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span class="bn-label">Mapa</span></button>
        <button type="button" class="bn-item" data-target="secPedidos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg><span class="bn-label">Pedidos</span></button>
        <button type="button" class="bn-item" data-keep="true" onclick="logout()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg><span class="bn-label">Salir</span></button>
    </nav>

    <!-- Script de Leaflet (Mapa gratuito) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
