# Construye el APK de la app de Flutter en la nube (no necesitas instalar nada en tu PC)
name: Construir APK de Flutter

on:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear la parte Android del proyecto
        run: flutter create . --org com.losbugs --project-name los_bugs --platforms android

      - name: Permiso de internet
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          extra = ('<uses-permission android:name="android.permission.INTERNET"/>\n'
                   '    <queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>\n    ')
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', extra + '<application', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - run: flutter pub get

      - name: Construir APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: LOS-BUGS-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
